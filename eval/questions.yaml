# Assistant eval: 20 questions with expected answers, graded deterministically by eval/run_eval.py.
#
# Expected values were taken from the gold views (as the reader SP) and the policy PDFs on 18 Nov 2026,
# independently of the assistant. Re-check them after a data refresh.
#
# Per question, every listed check must pass:
#   numbers:  each item must appear in the answer (within `tol`, absolute). A list item means "any of"
#             (e.g. [74, 0.74] for a percentage written either way). Thousands separators are ignored.
#   any_of:   each group must match: at least one phrase from the group appears (case-insensitive).
#   none_of:  none of these phrases may appear.
#   cite:     each group must match: at least one citation string appears (view name or "p. N").
#   tools:    each listed tool must have been called successfully at least once.
#   no_write: no successful query_gold call may contain a write/DDL keyword.

