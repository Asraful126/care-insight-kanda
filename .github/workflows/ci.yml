# CI/CD for the Care Insights assistant.
# - Every pull request and push to main: unit tests. Pull requests also build the image (no push).
# - Push to main (a merged PR): build the image, push it to GHCR tagged with the commit SHA, deploy it to
#   Azure Container Apps, and check the new revision answers.
# Azure sign-in is OIDC (decision D8): GitHub proves "a run on main of this repo" to Entra and gets a
# short-lived token. No Azure secret is stored in GitHub.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system library for pyodbc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  build:
    # PRs only: prove the image still builds before anything reaches main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t care-insights:pr .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write   # push to GHCR with the built-in GITHUB_TOKEN
      id-token: write   # OIDC token for Azure
    env:
      APP: ca-care-insights
      RG: rg-care-insights
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR needs lower case; tag = commit SHA, so every revision traces to a commit)
        run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/care-insights:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t "$IMG" .
          docker push "$IMG"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new revision
        run: az containerapp update -n "$APP" -g "$RG" --image "$IMG" --output none

      - name: Smoke test (the app may need up to a minute to start from zero)
        run: |
          FQDN=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 12); do
            if curl -fsS --max-time 20 "https://$FQDN/_stcore/health"; then echo; echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "app did not become healthy"; exit 1
